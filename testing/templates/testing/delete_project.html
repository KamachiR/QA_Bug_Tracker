<!DOCTYPE html>
<html>
<head>
    <title>Delete Project - QA Bug Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            color: #333;
        }

        header {
            background-color: #212529;
            color: white;
            padding: 22px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 6px 0 0;
            color: #d6d6d6;
        }

        nav {
            background-color: #343a40;
            padding: 14px 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #61dafb;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
        }

        .delete-card {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .delete-card h2 {
            margin-top: 0;
            color: #dc3545;
        }

        .warning {
            background-color: #fff3cd;
            border: 1px solid #ffecb5;
            color: #664d03;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .project-name {
            font-size: 20px;
            font-weight: bold;
            color: #212529;
            margin: 15px 0;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .button-section {
            margin-top: 25px;
        }

        .delete-button {
            padding: 11px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .delete-button:hover {
            background-color: #bb2d3b;
        }

        .cancel-button {
            display: inline-block;
            margin-left: 8px;
            padding: 10px 20px;
            background-color: #e9ecef;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .cancel-button:hover {
            background-color: #dee2e6;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #0d6efd;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            nav {
                padding: 12px 20px;
            }

            nav a {
                display: inline-block;
                margin: 5px 15px 5px 0;
            }

            .container {
                width: 90%;
            }

            .delete-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>QA Bug Tracker</h1>
        <p>Test Case & Bug Tracking Management System</p>
    </header>

    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'projects' %}">Projects</a>
        <a href="{% url 'test_cases' %}">Test Cases</a>
        <a href="{% url 'bugs' %}">Bugs</a>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>

    <div class="container">

        <div class="delete-card">

            <h2>Delete Project</h2>

            <div class="warning">
                ⚠️ This action cannot be undone.
            </div>

            <p>Are you sure you want to delete this project?</p>

            <p class="project-name">
                "{{ project.name }}"
            </p>

            <p class="description">
                {{ project.description }}
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="button-section">

                    <button
                        type="submit"
                        class="delete-button"
                    >
                        Yes, Delete Project
                    </button>

                    <a
                        href="{% url 'projects' %}"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

        <a href="{% url 'projects' %}" class="back">
            ← Back to Projects
        </a>

    </div>

</body>
</html>
